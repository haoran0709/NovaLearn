<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>概率与统计 - haoran的学习网站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .page-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .back-link {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        .back-link:hover { color: #764ba2; }

        .title {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .main-layout {
            display: flex;
            gap: 25px;
            min-height: 650px;
        }

        /* 左侧控制面板 */
        .control-panel {
            width: 340px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 18px;
            overflow-y: auto;
            max-height: 700px;
        }

        .panel-card {
            background: linear-gradient(145deg, #f6f8ff, #e9ecef);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group:last-child { margin-bottom: 0; }

        .form-label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-select, .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            outline: none;
            font-family: inherit;
        }

        .form-select:focus, .form-input:focus { border-color: #667eea; }

        textarea.form-input {
            resize: vertical;
            min-height: 100px;
            line-height: 1.6;
        }

        .hint-text {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
            line-height: 1.4;
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: #fff;
        }

        .btn-primary:hover { box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }

        .btn-danger {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: #fff;
        }

        .btn-danger:hover { box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }

        .btn-success {
            background: linear-gradient(45deg, #2ecc71, #27ae60);
            color: #fff;
        }

        .btn-success:hover { box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4); }

        /* 统计量结果 */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stat-item {
            background: #fff;
            border-radius: 8px;
            padding: 10px 12px;
            border-left: 3px solid #667eea;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
        }

        .stat-item.orange { border-left-color: #f39c12; }
        .stat-item.green { border-left-color: #2ecc71; }
        .stat-item.red { border-left-color: #e74c3c; }
        .stat-item.purple { border-left-color: #9b59b6; }
        .stat-item.teal { border-left-color: #1abc9c; }
        .stat-item.pink { border-left-color: #e91e63; }

        .stat-label {
            font-size: 11px;
            color: #999;
            font-weight: 500;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            font-family: 'Courier New', monospace;
        }

        .stat-empty {
            text-align: center;
            color: #999;
            font-size: 13px;
            padding: 20px 0;
            grid-column: 1 / -1;
        }

        /* 频率分布表 */
        .freq-table-wrapper {
            max-height: 200px;
            overflow-y: auto;
        }

        .freq-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .freq-table th {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: #fff;
            padding: 8px 10px;
            text-align: center;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        .freq-table td {
            padding: 6px 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .freq-table tr:hover td {
            background: #f6f8ff;
        }

        /* 右侧画布区域 */
        .chart-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chart-toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .chart-type-btn {
            padding: 8px 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            background: #fff;
            color: #555;
            transition: all 0.3s;
        }

        .chart-type-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .chart-type-btn.active {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.3);
        }

        .chart-wrapper {
            flex: 1;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
            min-height: 400px;
        }

        #chartCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .chart-empty {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ccc;
            font-size: 16px;
            text-align: center;
            pointer-events: none;
        }

        .chart-empty span {
            display: block;
            font-size: 40px;
            margin-bottom: 8px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .footer-text { color: #999; font-size: 14px; }
        .footer-link {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
        }
        .footer-link:hover { text-decoration: underline; }

        /* 示例数据按钮 */
        .example-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .example-btn {
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            background: #fff;
            color: #666;
            transition: all 0.2s;
        }

        .example-btn:hover {
            background: #667eea;
            color: #fff;
            border-color: #667eea;
        }

        /* 箱线图提示 */
        .boxplot-legend {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .boxplot-legend span {
            font-size: 12px;
            color: #666;
        }

        .boxplot-legend span::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 4px;
            vertical-align: middle;
            border-radius: 2px;
        }

        .legend-min::before { background: #e74c3c; }
        .legend-q1::before { background: #f39c12; }
        .legend-median::before { background: #667eea; }
        .legend-q3::before { background: #2ecc71; }
        .legend-max::before { background: #9b59b6; }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="header">
            <a class="back-link" href="math.html">🏠 返回数学平台</a>
            <h1 class="title">概率与统计</h1>
        </div>

        <div class="main-layout">
            <!-- 左侧控制面板 -->
            <div class="control-panel">
                <!-- 数据输入 -->
                <div class="panel-card">
                    <div class="panel-title">数据输入</div>
                    <div class="form-group">
                        <label class="form-label">输入数据（用逗号、空格或换行分隔）</label>
                        <textarea class="form-input" id="dataInput" placeholder="例如：12, 15, 18, 20, 15, 22, 18, 25, 15, 30"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">快速加载示例数据</label>
                        <div class="example-row">
                            <button class="example-btn" onclick="loadExample('scores')">考试成绩</button>
                            <button class="example-btn" onclick="loadExample('height')">身高数据</button>
                            <button class="example-btn" onclick="loadExample('dice')">掷骰子</button>
                            <button class="example-btn" onclick="loadExample('temp')">气温记录</button>
                        </div>
                    </div>
                    <div class="btn-row">
                        <button class="btn btn-primary" onclick="analyze()">分析数据</button>
                        <button class="btn btn-danger" onclick="clearAll()">清空</button>
                    </div>
                </div>

                <!-- 统计量 -->
                <div class="panel-card">
                    <div class="panel-title">统计量</div>
                    <div class="stats-grid" id="statsGrid">
                        <div class="stat-empty">输入数据后点击"分析数据"</div>
                    </div>
                </div>

                <!-- 频率分布表 -->
                <div class="panel-card" id="freqPanel" style="display:none;">
                    <div class="panel-title">频率分布表</div>
                    <div class="freq-table-wrapper">
                        <table class="freq-table" id="freqTable">
                            <thead><tr><th>数值</th><th>频数</th><th>频率</th><th>累计频率</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 右侧图表区 -->
            <div class="chart-area">
                <div class="chart-toolbar">
                    <button class="chart-type-btn active" data-type="bar" onclick="setChartType('bar')">条形图</button>
                    <button class="chart-type-btn" data-type="line" onclick="setChartType('line')">折线图</button>
                    <button class="chart-type-btn" data-type="pie" onclick="setChartType('pie')">扇形图</button>
                    <button class="chart-type-btn" data-type="histogram" onclick="setChartType('histogram')">直方图</button>
                    <button class="chart-type-btn" data-type="boxplot" onclick="setChartType('boxplot')">箱线图</button>
                    <button class="chart-type-btn" data-type="stem" onclick="setChartType('stem')">茎叶图</button>
                </div>
                <div class="chart-wrapper" id="chartWrapper">
                    <canvas id="chartCanvas"></canvas>
                    <div class="chart-empty" id="chartEmpty">
                        <span>📊</span>输入数据并分析后显示图表
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p class="footer-text">&copy; 2025-2026 Haoran. All rights reserved. Developed with AI assistance.</p>
        </div>
    </div>

    <script>
        var rawData = [];
        var chartType = 'bar';
        var canvas, ctx;

        var exampleData = {
            scores: '78, 85, 92, 65, 88, 73, 95, 60, 82, 77, 90, 68, 85, 72, 80, 93, 58, 87, 75, 83, 91, 70, 86, 79, 67',
            height: '155, 160, 162, 158, 165, 170, 163, 157, 168, 172, 160, 164, 159, 166, 161, 169, 163, 156, 167, 162, 171, 158, 164, 160, 165',
            dice: '3, 1, 4, 6, 2, 5, 3, 1, 6, 4, 2, 3, 5, 1, 4, 6, 2, 3, 5, 1, 4, 6, 2, 3, 5, 1, 6, 4, 3, 2',
            temp: '5, 8, 12, 15, 20, 25, 28, 30, 27, 22, 15, 8, 6, 9, 14, 18, 23, 27, 29, 26, 21, 14, 10, 7'
        };

        function init() {
            canvas = document.getElementById('chartCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', function() { resizeCanvas(); drawChart(); });
        }

        function resizeCanvas() {
            var rect = document.getElementById('chartWrapper').getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        function loadExample(key) {
            document.getElementById('dataInput').value = exampleData[key];
            analyze();
        }

        function parseData() {
            var text = document.getElementById('dataInput').value.trim();
            if (!text) return [];
            return text.split(/[,\s\n\r]+/).map(Number).filter(function(n) { return !isNaN(n); });
        }

        function analyze() {
            rawData = parseData();
            if (rawData.length === 0) return;

            var sorted = rawData.slice().sort(function(a, b) { return a - b; });
            var n = sorted.length;

            var sum = sorted.reduce(function(a, b) { return a + b; }, 0);
            var mean = sum / n;

            var median;
            if (n % 2 === 0) {
                median = (sorted[n / 2 - 1] + sorted[n / 2]) / 2;
            } else {
                median = sorted[Math.floor(n / 2)];
            }

            // 众数
            var freqMap = {};
            sorted.forEach(function(v) { freqMap[v] = (freqMap[v] || 0) + 1; });
            var maxFreq = Math.max.apply(null, Object.values(freqMap));
            var modes = [];
            for (var k in freqMap) {
                if (freqMap[k] === maxFreq) modes.push(parseFloat(k));
            }
            var modeStr = maxFreq === 1 ? '无' : modes.join(', ');

            // 极差
            var range = sorted[n - 1] - sorted[0];

            // 方差 & 标准差
            var variance = sorted.reduce(function(acc, v) { return acc + Math.pow(v - mean, 2); }, 0) / n;
            var stddev = Math.sqrt(variance);

            // Q1, Q3
            var q1 = percentile(sorted, 25);
            var q3 = percentile(sorted, 75);
            var iqr = q3 - q1;

            renderStats({
                count: n,
                sum: sum,
                mean: mean,
                median: median,
                mode: modeStr,
                min: sorted[0],
                max: sorted[n - 1],
                range: range,
                variance: variance,
                stddev: stddev,
                q1: q1,
                q3: q3,
                iqr: iqr
            });

            renderFreqTable(freqMap, n);
            drawChart();
            document.getElementById('chartEmpty').style.display = 'none';
        }

        function percentile(sorted, p) {
            var idx = (p / 100) * (sorted.length - 1);
            var lo = Math.floor(idx);
            var hi = Math.ceil(idx);
            if (lo === hi) return sorted[lo];
            return sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
        }

        function renderStats(s) {
            var grid = document.getElementById('statsGrid');
            grid.innerHTML =
                statHTML('样本数', s.count, '') +
                statHTML('总和', fmt(s.sum), '') +
                statHTML('平均数', fmt(s.mean), '') +
                statHTML('中位数', fmt(s.median), 'orange') +
                statHTML('众数', s.mode, 'purple') +
                statHTML('最小值', fmt(s.min), 'green') +
                statHTML('最大值', fmt(s.max), 'green') +
                statHTML('极差', fmt(s.range), 'red') +
                statHTML('方差', fmt(s.variance), 'teal') +
                statHTML('标准差', fmt(s.stddev), 'teal') +
                statHTML('Q1 (25%)', fmt(s.q1), 'purple') +
                statHTML('Q3 (75%)', fmt(s.q3), 'purple');
        }

        function statHTML(label, value, colorClass) {
            return '<div class="stat-item ' + colorClass + '"><div class="stat-label">' + label + '</div><div class="stat-value">' + value + '</div></div>';
        }

        function fmt(n) {
            if (Number.isInteger(n)) return n.toString();
            return n.toFixed(2);
        }

        function renderFreqTable(freqMap, total) {
            var panel = document.getElementById('freqPanel');
            panel.style.display = '';
            var tbody = document.querySelector('#freqTable tbody');
            tbody.innerHTML = '';
            var keys = Object.keys(freqMap).map(Number).sort(function(a, b) { return a - b; });
            var cumFreq = 0;
            keys.forEach(function(k) {
                var f = freqMap[k];
                cumFreq += f;
                var tr = document.createElement('tr');
                tr.innerHTML = '<td>' + k + '</td><td>' + f + '</td><td>' + (f / total * 100).toFixed(1) + '%</td><td>' + (cumFreq / total * 100).toFixed(1) + '%</td>';
                tbody.appendChild(tr);
            });
        }

        // ========== 图表绘制 ==========

        function setChartType(type) {
            chartType = type;
            document.querySelectorAll('.chart-type-btn').forEach(function(btn) {
                btn.classList.toggle('active', btn.getAttribute('data-type') === type);
            });
            if (rawData.length > 0) drawChart();
        }

        function drawChart() {
            if (!ctx || rawData.length === 0) return;
            resizeCanvas();
            var w = canvas.width;
            var h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#fafbff';
            ctx.fillRect(0, 0, w, h);

            switch (chartType) {
                case 'bar': drawBarChart(w, h); break;
                case 'line': drawLineChart(w, h); break;
                case 'pie': drawPieChart(w, h); break;
                case 'histogram': drawHistogram(w, h); break;
                case 'boxplot': drawBoxPlot(w, h); break;
                case 'stem': drawStemLeaf(w, h); break;
            }
        }

        function getFreqMap() {
            var map = {};
            rawData.forEach(function(v) { map[v] = (map[v] || 0) + 1; });
            return map;
        }

        var palette = ['#667eea', '#764ba2', '#f39c12', '#e74c3c', '#2ecc71', '#3498db', '#9b59b6', '#1abc9c', '#e67e22', '#e91e63'];

        // === 条形图 ===
        function drawBarChart(w, h) {
            var freq = getFreqMap();
            var keys = Object.keys(freq).map(Number).sort(function(a, b) { return a - b; });
            var maxVal = Math.max.apply(null, keys.map(function(k) { return freq[k]; }));

            var pad = { top: 40, right: 30, bottom: 60, left: 60 };
            var plotW = w - pad.left - pad.right;
            var plotH = h - pad.top - pad.bottom;
            var barW = Math.min(50, plotW / keys.length * 0.7);
            var gap = (plotW - barW * keys.length) / (keys.length + 1);

            drawTitle('条形图 — 频数分布', w, pad);
            drawYAxis(pad, plotH, maxVal, 5);
            drawXLabel(pad, plotH, '数值');

            keys.forEach(function(k, i) {
                var x = pad.left + gap * (i + 1) + barW * i;
                var barH = (freq[k] / maxVal) * plotH;
                var y = pad.top + plotH - barH;

                var grad = ctx.createLinearGradient(x, y, x, y + barH);
                grad.addColorStop(0, palette[i % palette.length]);
                grad.addColorStop(1, palette[i % palette.length] + '88');
                ctx.fillStyle = grad;
                roundRect(x, y, barW, barH, 4);

                ctx.fillStyle = '#333';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(freq[k], x + barW / 2, y - 6);
                ctx.font = '11px sans-serif';
                ctx.fillText(k, x + barW / 2, pad.top + plotH + 18);
            });
        }

        // === 折线图 ===
        function drawLineChart(w, h) {
            var freq = getFreqMap();
            var keys = Object.keys(freq).map(Number).sort(function(a, b) { return a - b; });
            var maxVal = Math.max.apply(null, keys.map(function(k) { return freq[k]; }));
            maxVal = Math.max(maxVal, 1);

            var pad = { top: 40, right: 30, bottom: 60, left: 60 };
            var plotW = w - pad.left - pad.right;
            var plotH = h - pad.top - pad.bottom;

            drawTitle('折线图 — 频数变化趋势', w, pad);
            drawYAxis(pad, plotH, maxVal, 5);
            drawXLabel(pad, plotH, '数值');

            var step = plotW / (keys.length - 1 || 1);

            // 填充区域
            ctx.beginPath();
            ctx.moveTo(pad.left, pad.top + plotH);
            keys.forEach(function(k, i) {
                var x = pad.left + i * step;
                var y = pad.top + plotH - (freq[k] / maxVal) * plotH;
                ctx.lineTo(x, y);
            });
            ctx.lineTo(pad.left + (keys.length - 1) * step, pad.top + plotH);
            ctx.closePath();
            var grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + plotH);
            grad.addColorStop(0, 'rgba(102, 126, 234, 0.25)');
            grad.addColorStop(1, 'rgba(102, 126, 234, 0.02)');
            ctx.fillStyle = grad;
            ctx.fill();

            // 线条
            ctx.beginPath();
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 2.5;
            ctx.lineJoin = 'round';
            keys.forEach(function(k, i) {
                var x = pad.left + i * step;
                var y = pad.top + plotH - (freq[k] / maxVal) * plotH;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // 数据点
            keys.forEach(function(k, i) {
                var x = pad.left + i * step;
                var y = pad.top + plotH - (freq[k] / maxVal) * plotH;

                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#667eea';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#333';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(freq[k], x, y - 12);
                ctx.font = '11px sans-serif';
                ctx.fillText(k, x, pad.top + plotH + 18);
            });
        }

        // === 扇形图 ===
        function drawPieChart(w, h) {
            var freq = getFreqMap();
            var keys = Object.keys(freq).map(Number).sort(function(a, b) { return a - b; });
            var total = rawData.length;

            var cx = w * 0.4;
            var cy = h * 0.52;
            var r = Math.min(cx, cy) - 40;

            drawTitle('扇形图 — 频率占比', w, { top: 30 });

            var startAngle = -Math.PI / 2;
            keys.forEach(function(k, i) {
                var slice = (freq[k] / total) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, startAngle, startAngle + slice);
                ctx.closePath();
                ctx.fillStyle = palette[i % palette.length];
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 标签
                if (slice > 0.15) {
                    var mid = startAngle + slice / 2;
                    var lx = cx + Math.cos(mid) * r * 0.6;
                    var ly = cy + Math.sin(mid) * r * 0.6;
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(k + ' (' + (freq[k] / total * 100).toFixed(1) + '%)', lx, ly);
                }

                startAngle += slice;
            });

            // 图例
            var legendX = w * 0.72;
            var legendY = 70;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            keys.forEach(function(k, i) {
                var y = legendY + i * 24;
                ctx.fillStyle = palette[i % palette.length];
                ctx.fillRect(legendX, y - 6, 14, 14);
                ctx.fillStyle = '#333';
                ctx.font = '13px sans-serif';
                ctx.fillText(k + '  (频数: ' + freq[k] + ')', legendX + 22, y + 1);
            });
        }

        // === 直方图 ===
        function drawHistogram(w, h) {
            var sorted = rawData.slice().sort(function(a, b) { return a - b; });
            var min = sorted[0];
            var max = sorted[sorted.length - 1];
            var n = sorted.length;

            var binCount = Math.max(3, Math.ceil(1 + 3.322 * Math.log10(n)));
            var binWidth = (max - min) / binCount;
            if (binWidth === 0) binWidth = 1;

            var bins = [];
            for (var i = 0; i < binCount; i++) {
                bins.push({ lo: min + i * binWidth, hi: min + (i + 1) * binWidth, count: 0 });
            }
            sorted.forEach(function(v) {
                var idx = Math.min(Math.floor((v - min) / binWidth), binCount - 1);
                bins[idx].count++;
            });

            var maxCount = Math.max.apply(null, bins.map(function(b) { return b.count; }));

            var pad = { top: 40, right: 30, bottom: 70, left: 60 };
            var plotW = w - pad.left - pad.right;
            var plotH = h - pad.top - pad.bottom;
            var bw = plotW / binCount;

            drawTitle('直方图 — 频率分布', w, pad);
            drawYAxis(pad, plotH, maxCount, 5);
            drawXLabel(pad, plotH, '数据区间');

            bins.forEach(function(bin, i) {
                var x = pad.left + i * bw;
                var barH = (bin.count / maxCount) * plotH;
                var y = pad.top + plotH - barH;

                var grad = ctx.createLinearGradient(x, y, x, y + barH);
                grad.addColorStop(0, '#667eea');
                grad.addColorStop(1, '#764ba2');
                ctx.fillStyle = grad;
                ctx.fillRect(x + 1, y, bw - 2, barH);

                ctx.fillStyle = '#333';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(bin.count, x + bw / 2, y - 5);
                ctx.font = '10px sans-serif';
                ctx.fillText(bin.lo.toFixed(1) + '~' + bin.hi.toFixed(1), x + bw / 2, pad.top + plotH + 16);
            });
        }

        // === 箱线图 ===
        function drawBoxPlot(w, h) {
            var sorted = rawData.slice().sort(function(a, b) { return a - b; });
            var min = sorted[0];
            var max = sorted[sorted.length - 1];
            var q1 = percentile(sorted, 25);
            var med = percentile(sorted, 50);
            var q3 = percentile(sorted, 75);

            var pad = { top: 60, right: 60, bottom: 60, left: 80 };
            var plotW = w - pad.left - pad.right;
            var plotH = h - pad.top - pad.bottom;
            var plotMid = pad.top + plotH / 2;
            var boxH = 70;

            drawTitle('箱线图 — 五数概括', w, pad);

            // X轴
            var dataRange = max - min || 1;
            function toX(v) { return pad.left + (v - min) / dataRange * plotW; }

            ctx.strokeStyle = '#ccc';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(pad.left, pad.top + plotH + 10);
            ctx.lineTo(pad.left + plotW, pad.top + plotH + 10);
            ctx.stroke();

            // 刻度
            var step = calcAxisStep(dataRange);
            ctx.fillStyle = '#666';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            for (var v = Math.ceil(min / step) * step; v <= max; v += step) {
                var x = toX(v);
                ctx.beginPath();
                ctx.moveTo(x, pad.top + plotH + 7);
                ctx.lineTo(x, pad.top + plotH + 13);
                ctx.strokeStyle = '#999';
                ctx.stroke();
                ctx.fillText(fmt(v), x, pad.top + plotH + 26);
            }

            // 须线 (min 到 Q1)
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 3]);
            ctx.beginPath();
            ctx.moveTo(toX(min), plotMid);
            ctx.lineTo(toX(q1), plotMid);
            ctx.stroke();
            ctx.setLineDash([]);

            // 须线 (Q3 到 max)
            ctx.strokeStyle = '#9b59b6';
            ctx.setLineDash([5, 3]);
            ctx.beginPath();
            ctx.moveTo(toX(q3), plotMid);
            ctx.lineTo(toX(max), plotMid);
            ctx.stroke();
            ctx.setLineDash([]);

            // 须端竖线
            [min, max].forEach(function(v) {
                ctx.beginPath();
                ctx.moveTo(toX(v), plotMid - 20);
                ctx.lineTo(toX(v), plotMid + 20);
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.setLineDash([]);
                ctx.stroke();
            });

            // 箱体 (Q1 到 Q3)
            var bx1 = toX(q1);
            var bx2 = toX(q3);
            var grad = ctx.createLinearGradient(bx1, plotMid - boxH / 2, bx2, plotMid + boxH / 2);
            grad.addColorStop(0, 'rgba(102, 126, 234, 0.25)');
            grad.addColorStop(1, 'rgba(118, 75, 162, 0.15)');
            ctx.fillStyle = grad;
            ctx.fillRect(bx1, plotMid - boxH / 2, bx2 - bx1, boxH);
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 2;
            ctx.strokeRect(bx1, plotMid - boxH / 2, bx2 - bx1, boxH);

            // 中位数线
            ctx.beginPath();
            ctx.moveTo(toX(med), plotMid - boxH / 2);
            ctx.lineTo(toX(med), plotMid + boxH / 2);
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 标注
            var labels = [
                { v: min, label: '最小值', color: '#e74c3c' },
                { v: q1, label: 'Q1', color: '#f39c12' },
                { v: med, label: '中位数', color: '#667eea' },
                { v: q3, label: 'Q3', color: '#2ecc71' },
                { v: max, label: '最大值', color: '#9b59b6' }
            ];
            labels.forEach(function(lb) {
                var x = toX(lb.v);
                ctx.fillStyle = lb.color;
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(lb.label, x, plotMid - boxH / 2 - 14);
                ctx.font = '11px sans-serif';
                ctx.fillText(fmt(lb.v), x, plotMid - boxH / 2 - 28);
            });
        }

        // === 茎叶图 ===
        function drawStemLeaf(w, h) {
            var sorted = rawData.slice().sort(function(a, b) { return a - b; });

            var allInt = sorted.every(function(v) { return Number.isInteger(v); });
            var mult = allInt ? 1 : 10;
            var data = sorted.map(function(v) { return Math.round(v * mult); });
            var stemMap = {};
            data.forEach(function(v) {
                var stem = Math.floor(v / 10);
                var leaf = Math.abs(v % 10);
                if (!stemMap[stem]) stemMap[stem] = [];
                stemMap[stem].push(leaf);
            });

            var pad = { top: 50, left: 60, right: 40, bottom: 30 };
            drawTitle('茎叶图', w, pad);

            var stems = Object.keys(stemMap).map(Number).sort(function(a, b) { return a - b; });
            var lineH = 28;
            var startY = pad.top + 10;

            // 表头
            ctx.fillStyle = '#667eea';
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('茎', pad.left + 40, startY);
            ctx.fillText('叶', pad.left + 120, startY);
            startY += 8;
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(pad.left, startY);
            ctx.lineTo(w - pad.right, startY);
            ctx.stroke();
            startY += 20;

            ctx.font = '14px "Courier New", monospace';
            ctx.textAlign = 'center';
            stems.forEach(function(stem) {
                var leaves = stemMap[stem].sort(function(a, b) { return a - b; });
                var stemDisplay = allInt ? stem : (stem / mult).toFixed(1);
                ctx.fillStyle = '#333';
                ctx.font = 'bold 14px "Courier New", monospace';
                ctx.fillText(stemDisplay, pad.left + 40, startY);
                ctx.fillStyle = '#667eea';
                ctx.font = '14px "Courier New", monospace';
                ctx.fillText(leaves.join('  '), pad.left + 120, startY);
                startY += lineH;
            });

            // 图例说明
            ctx.fillStyle = '#999';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'left';
            var unit = allInt ? '个位' : '十分位';
            ctx.fillText('茎 = 十位以上部分，叶 = ' + unit + '数字', pad.left, startY + 20);
        }

        // ========== 工具函数 ==========

        function drawTitle(text, w, pad) {
            ctx.fillStyle = '#333';
            ctx.font = 'bold 18px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(text, w / 2, pad.top - 12);
        }

        function drawYAxis(pad, plotH, maxVal, ticks) {
            maxVal = Math.max(maxVal, 1);
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 1;
            ctx.fillStyle = '#666';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'right';
            for (var i = 0; i <= ticks; i++) {
                var val = (maxVal / ticks * i);
                var y = pad.top + plotH - (val / maxVal) * plotH;
                ctx.beginPath();
                ctx.moveTo(pad.left, y);
                ctx.lineTo(pad.left + plotH + 100, y);
                ctx.stroke();
                ctx.fillText(fmt(val), pad.left - 8, y + 4);
            }
        }

        function drawXLabel(pad, plotH, text) {
            ctx.fillStyle = '#666';
            ctx.font = '13px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(text, pad.left + (canvas.width - pad.left - pad.right) / 2, pad.top + plotH + 48);
        }

        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h);
            ctx.lineTo(x, y + h);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
        }

        function calcAxisStep(range) {
            var raw = range / 6;
            var mag = Math.pow(10, Math.floor(Math.log10(raw)));
            var norm = raw / mag;
            if (norm < 1.5) return mag;
            if (norm < 3.5) return 2 * mag;
            if (norm < 7.5) return 5 * mag;
            return 10 * mag;
        }

        function clearAll() {
            document.getElementById('dataInput').value = '';
            rawData = [];
            document.getElementById('statsGrid').innerHTML = '<div class="stat-empty">输入数据后点击"分析数据"</div>';
            document.getElementById('freqPanel').style.display = 'none';
            document.getElementById('chartEmpty').style.display = '';
            resizeCanvas();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        init();
    </script>
</body>
