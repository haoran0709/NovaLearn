<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学学习平台 - haoran的学习网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            padding: 40px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .back-link {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #764ba2;
        }

        .title {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .subject-card {
            background: linear-gradient(145deg, #f6f8ff, #e9ecef);
            border-radius: 15px;
            padding: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            border-color: #667eea;
        }

        .subject-card.coming-soon::after {
            content: '即将上线';
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            color: #fff;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: bold;
        }

        .subject-icon {
            font-size: 60px;
            margin-bottom: 20px;
            display: block;
        }

        .subject-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .subject-description {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .algebra-icon { color: #e74c3c; }
        .geometry-icon { color: #3498db; }
        .function-icon { color: #2ecc71; }
        .trig-icon { color: #9b59b6; }
        .prob-icon { color: #f39c12; }
        .calc-icon { color: #1abc9c; }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
        }

        .footer-text {
            color: #999;
            font-size: 14px;
        }

        .footer-link {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
        }

        .footer-link:hover {
            text-decoration: underline;
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 30px 50px;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            text-align: center;
            line-height: 1.6;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .toast-emoji {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a class="back-link" href="index.html">
                <span>🏠 返回主页</span>
            </a>
            <h1 class="title">数学学习平台</h1>
            <p class="subtitle">探索数字与逻辑的美妙世界</p>
        </div>

        <div class="subjects-grid">
            <div class="subject-card coming-soon" data-target="">
                <span class="subject-icon algebra-icon">🔢</span>
                <h2 class="subject-title">代数基础</h2>
                <p class="subject-description">方程、不等式、整式与分式等代数知识练习</p>
            </div>

            <div class="subject-card coming-soon" data-target="">
                <span class="subject-icon geometry-icon">📐</span>
                <h2 class="subject-title">几何图形</h2>
                <p class="subject-description">三角形、圆、多边形等几何定理与证明</p>
            </div>

            <div class="subject-card" data-target="function.html">
                <span class="subject-icon function-icon">📈</span>
                <h2 class="subject-title">函数探索</h2>
                <p class="subject-description">一次函数、二次函数、反比例函数的图像与性质</p>
            </div>

            <div class="subject-card coming-soon" data-target="">
                <span class="subject-icon trig-icon">📐</span>
                <h2 class="subject-title">三角函数</h2>
                <p class="subject-description">正弦、余弦、正切等三角函数及其应用</p>
            </div>

            <div class="subject-card" data-target="statistics.html">
                <span class="subject-icon prob-icon">🎲</span>
                <h2 class="subject-title">概率与统计</h2>
                <p class="subject-description">数据分析、概率计算与统计图表</p>
            </div>

            <div class="subject-card coming-soon" data-target="">
                <span class="subject-icon calc-icon">∫</span>
                <h2 class="subject-title">微积分入门</h2>
                <p class="subject-description">极限、导数、积分的基本概念与应用</p>
            </div>
        </div>

        <div class="footer">
            <p class="footer-text">&copy; 2025-2026 Haoran. All rights reserved. Developed with AI assistance.</p>
        </div>
    </div>

    <div class="toast" id="toast">
        <span class="toast-emoji">🚧</span>
        正在制作中，敬请期待
    </div>

    <script>
        document.querySelectorAll('.subject-card').forEach(function (card) {
            card.addEventListener('click', function () {
                var target = this.getAttribute('data-target');
                if (target) {
                    window.location.href = target;
                } else {
                    showToast();
                }
            });
        });

        function showToast() {
            var toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(function () {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
