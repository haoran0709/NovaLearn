<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>函数图像探索 - haoran的学习网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .page-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .back-link {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        .back-link:hover { color: #764ba2; }

        .title {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .main-layout {
            display: flex;
            gap: 25px;
            min-height: 600px;
        }

        /* 左侧控制面板 */
        .control-panel {
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .panel-card {
            background: linear-gradient(145deg, #f6f8ff, #e9ecef);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group:last-child { margin-bottom: 0; }

        .form-label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-select, .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            outline: none;
        }

        .form-select:focus, .form-input:focus {
            border-color: #667eea;
        }

        .range-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: #fff;
        }

        .btn-primary:hover { box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }

        .btn-secondary {
            background: #e9ecef;
            color: #555;
        }

        .btn-secondary:hover { background: #dfe3e8; }

        .btn-danger {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: #fff;
        }

        .btn-danger:hover { box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }

        .btn-success {
            background: linear-gradient(45deg, #2ecc71, #27ae60);
            color: #fff;
        }

        .btn-success:hover { box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4); }

        .btn-orange {
            background: linear-gradient(45deg, #f39c12, #e67e22);
            color: #fff;
        }

        .btn-orange:hover { box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4); }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-wrapper input[type="color"] {
            width: 36px;
            height: 36px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            padding: 2px;
        }

        .formula-display {
            background: #fff;
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            font-family: 'Cambria Math', 'Times New Roman', serif;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 模式切换 */
        .mode-toggle {
            display: flex;
            gap: 0;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #667eea;
        }

        .mode-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            background: #fff;
            color: #667eea;
            transition: all 0.3s;
            text-align: center;
        }

        .mode-btn.active {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: #fff;
        }

        .mode-btn:first-child { border-right: 1px solid #667eea; }

        /* 已绘制函数列表 */
        .curve-list {
            max-height: 150px;
            overflow-y: auto;
        }

        .curve-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 13px;
            background: #fff;
        }

        .curve-item-color {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .curve-item-text {
            flex: 1;
            margin: 0 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .curve-item-remove {
            cursor: pointer;
            color: #e74c3c;
            font-weight: bold;
            font-size: 16px;
        }

        .curve-item-remove:hover { color: #c0392b; }

        /* 描点列表 */
        .point-list {
            max-height: 120px;
            overflow-y: auto;
        }

        .point-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 3px;
            font-size: 13px;
            background: #fff;
            font-family: 'Courier New', monospace;
        }

        .point-item-remove {
            cursor: pointer;
            color: #e74c3c;
            font-weight: bold;
            font-size: 15px;
        }

        .point-item-remove:hover { color: #c0392b; }

        .fit-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            margin-top: 10px;
        }

        .fit-row .form-group { flex: 1; margin-bottom: 0; }

        .hint-text {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
            line-height: 1.4;
        }

        /* 右侧画布 */
        .canvas-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .canvas-wrapper {
            flex: 1;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
        }

        #graphCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .coord-display {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            pointer-events: none;
        }

        .mode-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(102, 126, 234, 0.9);
            color: #fff;
            padding: 5px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
        }

        .mode-badge.point-mode {
            background: rgba(243, 156, 18, 0.9);
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .footer-text { color: #999; font-size: 14px; }
        .footer-link {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
        }
        .footer-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="header">
            <a class="back-link" href="math.html">🏠 返回数学平台</a>
            <h1 class="title">函数图像探索</h1>
        </div>

        <div class="main-layout">
            <!-- 左侧控制面板 -->
            <div class="control-panel">
                <!-- 模式切换 -->
                <div class="mode-toggle">
                    <button class="mode-btn active" id="modeFunc" onclick="setMode('func')">函数模式</button>
                    <button class="mode-btn" id="modePoint" onclick="setMode('point')">描点模式</button>
                </div>

                <!-- 函数类型选择 -->
                <div class="panel-card" id="funcPanel">
                    <div class="panel-title">函数类型</div>
                    <div class="form-group">
                        <select class="form-select" id="funcType" onchange="onFuncTypeChange()">
                            <option value="linear">一次函数 y = kx + b</option>
                            <option value="quadratic">二次函数 y = ax² + bx + c</option>
                            <option value="inverse">反比例函数 y = k / x</option>
                            <option value="exponential">指数函数 y = aˣ</option>
                            <option value="logarithmic">对数函数 y = log_a(x)</option>
                            <option value="sine">正弦函数 y = A·sin(ωx + φ)</option>
                            <option value="cosine">余弦函数 y = A·cos(ωx + φ)</option>
                        </select>
                    </div>
                    <div class="formula-display" id="formulaDisplay">y = kx + b</div>
                </div>

                <!-- 参数输入 -->
                <div class="panel-card" id="paramPanel">
                    <div class="panel-title">参数设置</div>
                    <div id="paramContainer"></div>
                    <div class="color-picker-wrapper" style="margin-top: 10px;">
                        <label class="form-label" style="margin:0">曲线颜色</label>
                        <input type="color" id="curveColor" value="#667eea">
                    </div>
                </div>

                <!-- 描点模式面板 -->
                <div class="panel-card" id="pointPanel" style="display:none;">
                    <div class="panel-title">描点与拟合</div>
                    <p class="hint-text">在坐标系中点击添加整数坐标点，系统将自动拟合函数曲线。</p>
                    <div class="point-list" id="pointList">
                        <div style="color: #999; font-size: 13px; text-align: center;">暂无描点</div>
                    </div>
                    <div class="fit-row">
                        <div class="form-group">
                            <label class="form-label">拟合阶数</label>
                            <select class="form-select" id="fitDegree">
                                <option value="1">一次 (直线)</option>
                                <option value="2">二次 (抛物线)</option>
                                <option value="3">三次</option>
                                <option value="4">四次</option>
                            </select>
                        </div>
                        <button class="btn btn-orange" onclick="fitCurve()" style="flex:none;padding:10px 14px;">拟合</button>
                    </div>
                </div>

                <!-- 坐标范围 -->
                <div class="panel-card">
                    <div class="panel-title">坐标范围</div>
                    <div class="range-group">
                        <div class="form-group">
                            <label class="form-label">X 最小</label>
                            <input type="number" class="form-input" id="xMin" value="-10" onchange="redraw()">
                        </div>
                        <div class="form-group">
                            <label class="form-label">X 最大</label>
                            <input type="number" class="form-input" id="xMax" value="10" onchange="redraw()">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Y 最小</label>
                            <input type="number" class="form-input" id="yMin" value="-10" onchange="redraw()">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Y 最大</label>
                            <input type="number" class="form-input" id="yMax" value="10" onchange="redraw()">
                        </div>
                    </div>
                    <p class="hint-text">鼠标滚轮可缩放坐标系</p>
                </div>

                <!-- 按钮 -->
                <div class="btn-row">
                    <button class="btn btn-primary" id="drawBtn" onclick="addCurve()">绘制图像</button>
                    <button class="btn btn-danger" onclick="clearAll()">清空全部</button>
                </div>

                <!-- 已绘制曲线列表 -->
                <div class="panel-card">
                    <div class="panel-title">已绘制曲线</div>
                    <div class="curve-list" id="curveList">
                        <div style="color: #999; font-size: 13px; text-align: center;">暂无曲线</div>
                    </div>
                </div>
            </div>

            <!-- 右侧画布 -->
            <div class="canvas-area">
                <div class="canvas-wrapper" id="canvasWrapper">
                    <canvas id="graphCanvas"></canvas>
                    <div class="coord-display" id="coordDisplay">x: 0, y: 0</div>
                    <div class="mode-badge" id="modeBadge">函数模式</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p class="footer-text">&copy; 2025-2026 Haoran. All rights reserved. Developed with AI assistance.</p>
        </div>
    </div>

    <script>
        var curves = [];
        var points = [];
        var currentMode = 'func';
        var canvas, ctx;
        var canvasWrapper;

        var funcDefs = {
            linear: {
                label: 'y = kx + b',
                params: [
                    { id: 'k', label: 'k (斜率)', value: 1 },
                    { id: 'b', label: 'b (截距)', value: 0 }
                ],
                fn: function(p, x) { return p.k * x + p.b; },
                formula: function(p) { return 'y = ' + p.k + 'x + ' + p.b; }
            },
            quadratic: {
                label: 'y = ax² + bx + c',
                params: [
                    { id: 'a', label: 'a', value: 1 },
                    { id: 'b', label: 'b', value: 0 },
                    { id: 'c', label: 'c', value: 0 }
                ],
                fn: function(p, x) { return p.a * x * x + p.b * x + p.c; },
                formula: function(p) { return 'y = ' + p.a + 'x² + ' + p.b + 'x + ' + p.c; }
            },
            inverse: {
                label: 'y = k / x',
                params: [{ id: 'k', label: 'k', value: 1 }],
                fn: function(p, x) { if (x === 0) return NaN; return p.k / x; },
                formula: function(p) { return 'y = ' + p.k + ' / x'; }
            },
            exponential: {
                label: 'y = aˣ',
                params: [{ id: 'a', label: 'a (底数)', value: 2 }],
                fn: function(p, x) { return Math.pow(p.a, x); },
                formula: function(p) { return 'y = ' + p.a + '^x'; }
            },
            logarithmic: {
                label: 'y = log_a(x)',
                params: [{ id: 'a', label: 'a (底数)', value: 10 }],
                fn: function(p, x) { if (x <= 0) return NaN; return Math.log(x) / Math.log(p.a); },
                formula: function(p) { return 'y = log_' + p.a + '(x)'; }
            },
            sine: {
                label: 'y = A·sin(ωx + φ)',
                params: [
                    { id: 'A', label: 'A (振幅)', value: 1 },
                    { id: 'omega', label: 'ω (角频率)', value: 1 },
                    { id: 'phi', label: 'φ (初相)', value: 0 }
                ],
                fn: function(p, x) { return p.A * Math.sin(p.omega * x + p.phi); },
                formula: function(p) { return 'y = ' + p.A + '·sin(' + p.omega + 'x + ' + p.phi + ')'; }
            },
            cosine: {
                label: 'y = A·cos(ωx + φ)',
                params: [
                    { id: 'A', label: 'A (振幅)', value: 1 },
                    { id: 'omega', label: 'ω (角频率)', value: 1 },
                    { id: 'phi', label: 'φ (初相)', value: 0 }
                ],
                fn: function(p, x) { return p.A * Math.cos(p.omega * x + p.phi); },
                formula: function(p) { return 'y = ' + p.A + '·cos(' + p.omega + 'x + ' + p.phi + ')'; }
            }
        };

        function init() {
            canvasWrapper = document.getElementById('canvasWrapper');
            canvas = document.getElementById('graphCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', function() { resizeCanvas(); redraw(); });
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('wheel', onWheel, { passive: false });
            canvas.addEventListener('click', onCanvasClick);
            onFuncTypeChange();
            redraw();
        }

        function resizeCanvas() {
            var rect = canvasWrapper.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        function getRange() {
            var xMin = parseFloat(document.getElementById('xMin').value) || -10;
            var xMax = parseFloat(document.getElementById('xMax').value) || 10;
            var yMin = parseFloat(document.getElementById('yMin').value) || -10;
            var yMax = parseFloat(document.getElementById('yMax').value) || 10;
            if (xMin >= xMax) xMax = xMin + 1;
            if (yMin >= yMax) yMax = yMin + 1;
            return { xMin: xMin, xMax: xMax, yMin: yMin, yMax: yMax };
        }

        function setRange(xMin, xMax, yMin, yMax) {
            document.getElementById('xMin').value = parseFloat(xMin.toFixed(4));
            document.getElementById('xMax').value = parseFloat(xMax.toFixed(4));
            document.getElementById('yMin').value = parseFloat(yMin.toFixed(4));
            document.getElementById('yMax').value = parseFloat(yMax.toFixed(4));
        }

        // === 模式切换 ===
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeFunc').classList.toggle('active', mode === 'func');
            document.getElementById('modePoint').classList.toggle('active', mode === 'point');
            document.getElementById('funcPanel').style.display = mode === 'func' ? '' : 'none';
            document.getElementById('paramPanel').style.display = mode === 'func' ? '' : 'none';
            document.getElementById('pointPanel').style.display = mode === 'point' ? '' : 'none';
            document.getElementById('drawBtn').textContent = mode === 'func' ? '绘制图像' : '拟合曲线';
            var badge = document.getElementById('modeBadge');
            if (mode === 'func') {
                badge.textContent = '函数模式';
                badge.classList.remove('point-mode');
                canvas.style.cursor = 'crosshair';
            } else {
                badge.textContent = '描点模式 — 点击添加点';
                badge.classList.add('point-mode');
                canvas.style.cursor = 'pointer';
            }
        }

        // === 滚轮缩放 ===
        function onWheel(e) {
            e.preventDefault();
            var rect = canvas.getBoundingClientRect();
            var mx = e.clientX - rect.left;
            var my = e.clientY - rect.top;
            var r = getRange();
            var padding = 40;
            var plotW = canvas.width - padding * 2;
            var plotH = canvas.height - padding * 2;

            // 鼠标位置对应的数学坐标
            var mathX = r.xMin + (mx - padding) / plotW * (r.xMax - r.xMin);
            var mathY = r.yMax - (my - padding) / plotH * (r.yMax - r.yMin);

            var factor = e.deltaY > 0 ? 1.15 : 1 / 1.15;

            var newXMin = mathX - (mathX - r.xMin) * factor;
            var newXMax = mathX + (r.xMax - mathX) * factor;
            var newYMin = mathY - (mathY - r.yMin) * factor;
            var newYMax = mathY + (r.yMax - mathY) * factor;

            setRange(newXMin, newXMax, newYMin, newYMax);
            redraw();
        }

        // === 描点 ===
        function onCanvasClick(e) {
            if (currentMode !== 'point') return;
            var rect = canvas.getBoundingClientRect();
            var sx = e.clientX - rect.left;
            var sy = e.clientY - rect.top;
            var r = getRange();
            var padding = 40;
            var plotW = canvas.width - padding * 2;
            var plotH = canvas.height - padding * 2;

            var mathX = r.xMin + (sx - padding) / plotW * (r.xMax - r.xMin);
            var mathY = r.yMax - (sy - padding) / plotH * (r.yMax - r.yMin);

            // 吸附到最近整数
            var ix = Math.round(mathX);
            var iy = Math.round(mathY);

            // 检查是否已存在
            for (var i = 0; i < points.length; i++) {
                if (points[i].x === ix && points[i].y === iy) return;
            }

            points.push({ x: ix, y: iy });
            updatePointList();
            redraw();
        }

        function removePoint(index) {
            points.splice(index, 1);
            updatePointList();
            redraw();
        }

        function updatePointList() {
            var list = document.getElementById('pointList');
            if (points.length === 0) {
                list.innerHTML = '<div style="color: #999; font-size: 13px; text-align: center;">暂无描点</div>';
                return;
            }
            list.innerHTML = '';
            points.forEach(function(pt, i) {
                var item = document.createElement('div');
                item.className = 'point-item';
                item.innerHTML = '<span>(' + pt.x + ', ' + pt.y + ')</span>' +
                    '<span class="point-item-remove" onclick="removePoint(' + i + ')">&times;</span>';
                list.appendChild(item);
            });
        }

        // === 最小二乘多项式拟合 ===
        function fitCurve() {
            if (points.length < 2) return;
            var deg = parseInt(document.getElementById('fitDegree').value);
            if (points.length <= deg) {
                alert('描点数量需要大于拟合阶数（至少 ' + (deg + 1) + ' 个点）');
                return;
            }

            var n = points.length;
            var m = deg + 1;

            // 构建正规方程组 A^T * A * c = A^T * y
            var mat = [];
            var rhs = [];
            for (var i = 0; i < m; i++) {
                mat[i] = [];
                for (var j = 0; j < m; j++) {
                    var sum = 0;
                    for (var k = 0; k < n; k++) {
                        sum += Math.pow(points[k].x, i + j);
                    }
                    mat[i][j] = sum;
                }
                var s = 0;
                for (var k = 0; k < n; k++) {
                    s += Math.pow(points[k].x, i) * points[k].y;
                }
                rhs[i] = s;
            }

            // 高斯消元
            var coeffs = gaussElim(mat, rhs);
            if (!coeffs) {
                alert('拟合失败，请检查描点是否有重复的 x 值');
                return;
            }

            // 构建拟合曲线
            var color = document.getElementById('curveColor').value;
            var curve = {
                type: 'fitted',
                coeffs: coeffs,
                color: color,
                formulaText: formatPoly(coeffs)
            };
            curves.push(curve);
            updateCurveList();
            redraw();
        }

        function gaussElim(A, b) {
            var n = A.length;
            // 增广矩阵
            for (var i = 0; i < n; i++) {
                A[i].push(b[i]);
            }
            for (var col = 0; col < n; col++) {
                // 选主元
                var maxRow = col;
                for (var row = col + 1; row < n; row++) {
                    if (Math.abs(A[row][col]) > Math.abs(A[maxRow][col])) maxRow = row;
                }
                var tmp = A[col]; A[col] = A[maxRow]; A[maxRow] = tmp;
                if (Math.abs(A[col][col]) < 1e-12) return null;
                // 消元
                for (var row = col + 1; row < n; row++) {
                    var f = A[row][col] / A[col][col];
                    for (var j = col; j <= n; j++) {
                        A[row][j] -= f * A[col][j];
                    }
                }
            }
            // 回代
            var x = new Array(n);
            for (var i = n - 1; i >= 0; i--) {
                x[i] = A[i][n];
                for (var j = i + 1; j < n; j++) {
                    x[i] -= A[i][j] * x[j];
                }
                x[i] /= A[i][i];
            }
            return x;
        }

        function formatPoly(coeffs) {
            var parts = [];
            for (var i = coeffs.length - 1; i >= 0; i--) {
                var c = parseFloat(coeffs[i].toFixed(4));
                if (Math.abs(c) < 1e-8) continue;
                var sign = c >= 0 ? '+ ' : '- ';
                var absC = Math.abs(c);
                var term = '';
                if (i === 0) {
                    term = absC.toString();
                } else if (i === 1) {
                    term = (absC === 1 ? '' : absC) + 'x';
                } else {
                    term = (absC === 1 ? '' : absC) + 'x' + superscript(i);
                }
                parts.push(sign + term);
            }
            if (parts.length === 0) return 'y = 0';
            var result = 'y = ' + parts.join(' ');
            if (result.indexOf('y = + ') === 0) result = 'y = ' + result.slice(6);
            if (result.indexOf('y = - ') === 0) result = 'y = -' + result.slice(6);
            return result;
        }

        function superscript(n) {
            var sups = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
            return n.toString().split('').map(function(ch) { return sups[ch] || ch; }).join('');
        }

        // === 函数模式逻辑 ===
        function onFuncTypeChange() {
            var type = document.getElementById('funcType').value;
            var def = funcDefs[type];
            document.getElementById('formulaDisplay').textContent = def.label;
            var container = document.getElementById('paramContainer');
            container.innerHTML = '';
            def.params.forEach(function(param) {
                var div = document.createElement('div');
                div.className = 'form-group';
                div.innerHTML = '<label class="form-label">' + param.label + '</label>' +
                    '<input type="number" class="form-input" id="param_' + param.id + '" value="' + param.value + '" step="any">';
                container.appendChild(div);
            });
        }

        function getParams() {
            var type = document.getElementById('funcType').value;
            var def = funcDefs[type];
            var p = {};
            def.params.forEach(function(param) {
                var el = document.getElementById('param_' + param.id);
                p[param.id] = parseFloat(el.value) || 0;
            });
            return { type: type, params: p, color: document.getElementById('curveColor').value };
        }

        function addCurve() {
            if (currentMode === 'point') {
                fitCurve();
                return;
            }
            var curve = getParams();
            var def = funcDefs[curve.type];
            curve.formulaText = def.formula(curve.params);
            curves.push(curve);
            updateCurveList();
            redraw();
        }

        function removeCurve(index) {
            curves.splice(index, 1);
            updateCurveList();
            redraw();
        }

        function clearAll() {
            curves = [];
            points = [];
            updateCurveList();
            updatePointList();
            redraw();
        }

        function updateCurveList() {
            var list = document.getElementById('curveList');
            if (curves.length === 0) {
                list.innerHTML = '<div style="color: #999; font-size: 13px; text-align: center;">暂无曲线</div>';
                return;
            }
            list.innerHTML = '';
            curves.forEach(function(curve, i) {
                var item = document.createElement('div');
                item.className = 'curve-item';
                item.innerHTML = '<span class="curve-item-color" style="background:' + curve.color + '"></span>' +
                    '<span class="curve-item-text">' + curve.formulaText + '</span>' +
                    '<span class="curve-item-remove" onclick="removeCurve(' + i + ')">&times;</span>';
                list.appendChild(item);
            });
        }

        // === 绘制 ===
        function redraw() {
            if (!ctx) return;
            var w = canvas.width;
            var h = canvas.height;
            var r = getRange();

            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#fafbff';
            ctx.fillRect(0, 0, w, h);

            var padding = 40;
            var plotW = w - padding * 2;
            var plotH = h - padding * 2;

            function toScreenX(x) { return padding + (x - r.xMin) / (r.xMax - r.xMin) * plotW; }
            function toScreenY(y) { return padding + (r.yMax - y) / (r.yMax - r.yMin) * plotH; }

            // 网格线
            ctx.strokeStyle = '#e8eaf0';
            ctx.lineWidth = 1;
            var step = calcStep(r.xMax - r.xMin);
            for (var gx = Math.ceil(r.xMin / step) * step; gx <= r.xMax; gx += step) {
                var sx = toScreenX(gx);
                ctx.beginPath(); ctx.moveTo(sx, padding); ctx.lineTo(sx, h - padding); ctx.stroke();
            }
            step = calcStep(r.yMax - r.yMin);
            for (var gy = Math.ceil(r.yMin / step) * step; gy <= r.yMax; gy += step) {
                var sy = toScreenY(gy);
                ctx.beginPath(); ctx.moveTo(padding, sy); ctx.lineTo(w - padding, sy); ctx.stroke();
            }

            // 坐标轴
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            if (r.yMin <= 0 && r.yMax >= 0) {
                var axisY = toScreenY(0);
                ctx.beginPath(); ctx.moveTo(padding, axisY); ctx.lineTo(w - padding, axisY); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(w - padding, axisY); ctx.lineTo(w - padding - 8, axisY - 4); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(w - padding, axisY); ctx.lineTo(w - padding - 8, axisY + 4); ctx.stroke();
            }
            if (r.xMin <= 0 && r.xMax >= 0) {
                var axisX = toScreenX(0);
                ctx.beginPath(); ctx.moveTo(axisX, padding); ctx.lineTo(axisX, h - padding); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(axisX, padding); ctx.lineTo(axisX - 4, padding + 8); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(axisX, padding); ctx.lineTo(axisX + 4, padding + 8); ctx.stroke();
            }

            // 刻度标签
            ctx.fillStyle = '#666';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            step = calcStep(r.xMax - r.xMin);
            for (var lx = Math.ceil(r.xMin / step) * step; lx <= r.xMax; lx += step) {
                if (Math.abs(lx) < step * 0.01) continue;
                var lsx = toScreenX(lx);
                var labelY = (r.yMin <= 0 && r.yMax >= 0) ? toScreenY(0) + 16 : h - padding + 16;
                ctx.fillText(formatNum(lx), lsx, labelY);
            }
            ctx.textAlign = 'right';
            step = calcStep(r.yMax - r.yMin);
            for (var ly = Math.ceil(r.yMin / step) * step; ly <= r.yMax; ly += step) {
                if (Math.abs(ly) < step * 0.01) continue;
                var lsy = toScreenY(ly);
                var labelX = (r.xMin <= 0 && r.xMax >= 0) ? toScreenX(0) - 6 : padding - 6;
                ctx.fillText(formatNum(ly), labelX, lsy + 4);
            }
            if (r.xMin <= 0 && r.xMax >= 0 && r.yMin <= 0 && r.yMax >= 0) {
                ctx.textAlign = 'right';
                ctx.fillText('O', toScreenX(0) - 6, toScreenY(0) + 16);
            }

            // 绘制曲线
            curves.forEach(function(curve) {
                var drawFn;
                if (curve.type === 'fitted') {
                    drawFn = function(x) {
                        var y = 0;
                        for (var i = 0; i < curve.coeffs.length; i++) {
                            y += curve.coeffs[i] * Math.pow(x, i);
                        }
                        return y;
                    };
                } else {
                    var def = funcDefs[curve.type];
                    drawFn = function(x) { return def.fn(curve.params, x); };
                }
                ctx.strokeStyle = curve.color;
                ctx.lineWidth = 2.5;
                ctx.lineJoin = 'round';
                ctx.beginPath();
                var started = false;
                var pxStep = (r.xMax - r.xMin) / plotW;
                for (var px = 0; px <= plotW; px++) {
                    var mx = r.xMin + px * pxStep;
                    var my = drawFn(mx);
                    if (isNaN(my) || !isFinite(my)) { started = false; continue; }
                    var ssy = toScreenY(my);
                    if (ssy < -1000 || ssy > h + 1000) { started = false; continue; }
                    if (!started) {
                        ctx.moveTo(toScreenX(mx), ssy);
                        started = true;
                    } else {
                        ctx.lineTo(toScreenX(mx), ssy);
                    }
                }
                ctx.stroke();
            });

            // 绘制描点
            points.forEach(function(pt) {
                var px = toScreenX(pt.x);
                var py = toScreenY(pt.y);
                // 外圈
                ctx.beginPath();
                ctx.arc(px, py, 7, 0, Math.PI * 2);
                ctx.fillStyle = '#f39c12';
                ctx.fill();
                ctx.strokeStyle = '#e67e22';
                ctx.lineWidth = 2;
                ctx.stroke();
                // 内圈
                ctx.beginPath();
                ctx.arc(px, py, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                // 坐标标签
                ctx.fillStyle = '#333';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('(' + pt.x + ',' + pt.y + ')', px, py - 14);
            });
        }

        function calcStep(range) {
            var raw = range / 10;
            var mag = Math.pow(10, Math.floor(Math.log10(raw)));
            var norm = raw / mag;
            if (norm < 1.5) return mag;
            if (norm < 3.5) return 2 * mag;
            if (norm < 7.5) return 5 * mag;
            return 10 * mag;
        }

        function formatNum(n) {
            if (Number.isInteger(n)) return n.toString();
            return parseFloat(n.toFixed(2)).toString();
        }

        function onMouseMove(e) {
            var rect = canvas.getBoundingClientRect();
            var sx = e.clientX - rect.left;
            var sy = e.clientY - rect.top;
            var r = getRange();
            var padding = 40;
            var plotW = canvas.width - padding * 2;
            var plotH = canvas.height - padding * 2;
            var mx = r.xMin + (sx - padding) / plotW * (r.xMax - r.xMin);
            var my = r.yMax - (sy - padding) / plotH * (r.yMax - r.yMin);

            var text = 'x: ' + mx.toFixed(2) + ', y: ' + my.toFixed(2);
            if (currentMode === 'point') {
                text += '  → (' + Math.round(mx) + ', ' + Math.round(my) + ')';
            }
            document.getElementById('coordDisplay').textContent = text;
        }

        init();
    </script>
</body>
</html>
